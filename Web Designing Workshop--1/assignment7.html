
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Navigation Menu</title>

    <style>
        nav {
            background-color: #333;
            padding: 15px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 50px;
            margin: 0;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 20px;
        }

        nav ul li a:hover {
            color: yellow;
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Courses</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

</body>
</html>
