
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quotation and Citation</title>
</head>
<body>

    <blockquote>
        The best way to predict the future is to create it.
    </blockquote>

    <p>
        As he said,
        <q>Stay hungry, stay foolish.</q>
    </p>

    <p>
        Book: <cite>The Pragmatic Programmer</cite>
    </p>

    <p>
        <abbr title="World Wide Web Consortium">
            W3C
        </abbr>
        sets web standards.
    </p>

    <address>
        Contact: Admin Office<br>
        College Road, Delhi
    </address>

    <p>
        <del>Old price 500</del>
        <ins>New price 400</ins>//  Added a new price for the product
    </p>

</body>
</html>
