
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multimedia</title>
</head>
<body>

    <h3>Image</h3>

    <img src="college.jpg"
         alt="College campus"
         width="150"
         height="150">

    <h3>Video</h3>

    <video width="250" controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support video.
    </video>

    <h3>Audio</h3>

    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <h3>YouTube</h3>

    <iframe
        width="350"
        height="200"
        src="https://www.youtube.com/embed/VIDEO_ID"
        title="YouTube Video"
        allowfullscreen>
    </iframe>// Added a YouTube video embed for demonstration

</body>
</html>
