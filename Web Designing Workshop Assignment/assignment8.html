
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Links Demo</title>
</head>
<body>

    <p>Links demo</p>

    <!-- External Link -->
    <a href="https://www.google.com" target="_blank">
        External link
    </a>
    <br>

    <!-- Internal Link -->
    <a href="#bottom">Jump to bottom</a>
    <br>

    <!-- Email Link -->
    <a href="mailto:admin@example.com">Email us</a>
    <br>

    <!-- Image with Attributes -->
    <a href="https://www.google.com">
        <img src="logo.png"
             alt="Logo"
             width="130"
             height="65">
    </a>

    <div style="height: 380px;"></div>

    <p id="bottom">
        Bottom.
        <a href="#top">Back to top</a>// Added a back to top link for easy navigation
    </p>

</body>
</html>
