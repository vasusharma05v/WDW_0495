<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 18 - Student Admission Page</title>
    <style>
        body {
            font-family: Georgia, serif;
            max-width: 650px;
            margin: 20px auto;
            padding: 0 15px;
        }
        header, footer {
            background-color: #19247c;
            color: white;
            text-align: center;
            padding: 15px;
        }
        footer {
            padding: 10px;
            margin-top: 20px;
            font-size: 0.9em;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        caption {
            font-weight: normal;
            margin-bottom: 5px;
        }
        th, td {
            border: 1px solid #b5b5b5;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #eaedf7;
            text-align: center;
        }
        fieldset {
            padding: 15px;
        }
        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 3px;
        }
        input[type="text"], input[type="email"] {
            width: 220px;
            padding: 3px;
        }
        textarea {
            width: 85%;
            height: 70px;
        }
        button {
            margin-top: 15px;
            padding: 5px 12px;
        }
    </style>
</head>
<body>

    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <section>
            <h2>Courses and Fees</h2>
            <table>
                <caption>Available Courses</caption>
                <thead>
                    <tr>
                        <th scope="col">Course</th>
                        <th scope="col">Seats</th>
                        <th scope="col">Fees</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>B.Tech CSE</td>
                        <td>120</td>
                        <td>&#8377;90,000</td>
                    </tr>
                    <tr>
                        <td>BCA</td>
                        <td>60</td>
                        <td>&#8377;45,000</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section>
            <form action="#" method="POST">
                <fieldset>
                    <legend>Application Form</legend>

                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="course">Course:</label>
                    <select id="course" name="course">
                        <option value="btech-cse" selected>B.Tech CSE</option>
                        <option value="bca">BCA</option>
                    </select>

                    <label for="statement">Statement:</label>
                    <textarea id="statement" name="statement" required></textarea>

                    <br>
                    <button type="submit">Apply</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ABC College</p>// Added a footer with copyright information
    </footer>

</body>
</html>
